<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관계성범죄 사건 담당자 설문</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --paper:#FFFBEA;
  --card:#FFFFFF;
  --card-soft:#FFF6DE;
  --ink:#3A2B20;
  --ink-soft:#6E5D4C;
  --ink-faint:#A6957E;
  --line:#EDE1C4;
  --line-soft:#F6EED7;
  --primary:#808bde;
  --primary-deep:#4c64dd;
  --accent:#C98FA6;
  --accent-deep:#A2647E;
  --accent-soft:#F5E2E9;
  --error:#B2543F;
  --error-soft:#F3E2DC;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:10px;
  --shadow-soft:0 4px 18px rgba(84,68,42,0.07);
  --shadow-lift:0 8px 28px rgba(84,68,42,0.12);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.6;
  padding-bottom:100px;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- progress ---------- */
#progress-wrap{
  position:sticky; top:0; z-index:50;
  background:linear-gradient(180deg, var(--paper) 60%, rgba(246,241,231,0.0));
  padding:14px 20px 10px;
  backdrop-filter:blur(6px);
}
#progress-inner{ max-width:660px; margin:0 auto; }
#progress-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:7px; }
#progress-title{ font-size:12.5px; font-weight:700; color:var(--primary-deep); letter-spacing:.02em; }
#progress-count{ font-size:11px; color:var(--ink-faint); font-weight:600; }
#progress-track{ height:8px; background:var(--line-soft); border-radius:8px; overflow:visible; position:relative; }
#progress-fill{ height:100%; width:0%; background:var(--accent); border-radius:8px; transition:width .45s cubic-bezier(.4,0,.2,1); position:relative; min-width:8px; }
#progress-fill::before, #progress-fill::after{ content:""; position:absolute; top:50%; transform:translateY(-50%); width:12px; height:12px; border-radius:50%; background:var(--accent-deep); }
#progress-fill::before{ left:-4px; }
#progress-fill::after{ right:-4px; }

header.top{ max-width:660px; margin:0 auto; padding:26px 20px 4px; }
header.top .org{ font-size:11.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
header.top h1{ font-size:20px; margin:8px 0 0; color:var(--primary-deep); font-weight:800; letter-spacing:-.01em; }

main{ max-width:660px; margin:0 auto; padding:10px 20px 20px; min-height:56vh; position:relative; }

/* ---------- pages / transitions ---------- */
#pages-container{ position:relative; }
.page{ display:none; width:100%; }
.page.active{ display:block; }
#pages-container.transitioning{ overflow:hidden; }
#pages-container.transitioning .page.active,
#pages-container.transitioning .page.incoming{
  position:absolute; top:0; left:0; width:100%;
  will-change:transform,opacity;
}

.page-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--sec-color, var(--accent-deep)); margin-bottom:5px; }
.page-head{ margin:16px 0 16px; }
.page-head h2{ font-size:18px; margin:0; color:var(--ink); font-weight:800; letter-spacing:-.01em; }
.page-intro{ background:var(--card-soft); border-radius:var(--radius-md); padding:14px 17px; font-size:13.6px; color:var(--ink-soft); margin-bottom:16px; border:1px solid var(--line-soft); }

/* ---------- question card ---------- */
.q{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px 18px 15px; margin-bottom:13px; box-shadow:var(--shadow-soft); }
.q.hidden{ display:none; }
.q.invalid{ border-color:var(--error); box-shadow:0 0 0 3px var(--error-soft); }
.q-text{ font-size:14.5px; font-weight:700; margin-bottom:11px; color:var(--ink); }
.q-text .req{ color:var(--error); margin-left:2px; font-weight:700; }
.q-note{ font-size:12px; color:var(--ink-faint); margin:-5px 0 11px; line-height:1.55; }
.q-error{ display:none; font-size:12px; color:var(--error); margin-top:7px; font-weight:700; }
.q.invalid .q-error{ display:block; }

.opt-list{ display:flex; flex-direction:column; gap:8px; }
.opt{ display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer; font-size:13.8px; transition:background .15s,border-color .15s; background:var(--card-soft); }
.opt:hover{ background:var(--accent-soft); border-color:#D8CBAE; }
.opt input{ margin-top:2px; accent-color:var(--accent-deep); width:16px; height:16px; flex:none; }
.opt.checked{ border-color:var(--accent-deep); background:var(--accent-soft); }
.other-text{ margin-top:8px; margin-left:26px; width:calc(100% - 26px); padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); font-size:13.5px; font-family:inherit; display:none; background:#fff; }
.other-text.show{ display:block; }

input[type=text].qi, textarea.qi{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); font-family:inherit; font-size:13.8px; resize:vertical; background:#fff; }
textarea.qi{ min-height:74px; }
input[type=text].qi:focus, textarea.qi:focus, select.qi:focus{ outline:2px solid var(--accent-deep); outline-offset:1px; }

.likert-row{ display:flex; gap:7px; justify-content:space-between; }
.likert-btn{ flex:1; text-align:center; padding:11px 4px; border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer; font-weight:700; font-size:14px; color:var(--ink-soft); background:var(--card-soft); }
.likert-btn.checked{ background:var(--primary); color:#fff; border-color:var(--primary); }
.likert-labels{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); margin-top:7px; }

.grid-wrap{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; }
.grid-row{ display:flex; flex-direction:column; padding:12px 14px; border-bottom:1px solid var(--line-soft); background:var(--card); }
.grid-row:last-child{ border-bottom:none; }
.grid-row .g-label{ font-size:13.5px; font-weight:600; margin-bottom:9px; }
.grid-row .g-opts{ display:flex; gap:8px; }
.grid-opt{ flex:1; text-align:center; padding:9px 4px; border:1px solid var(--line); border-radius:var(--radius-sm); cursor:pointer; font-size:13px; background:var(--card-soft); }
.grid-opt.checked{ background:var(--primary); color:#fff; border-color:var(--primary); }
@media (min-width:640px){
  .grid-row{ flex-direction:row; align-items:center; justify-content:space-between; }
  .grid-row .g-label{ margin-bottom:0; flex:1; padding-right:14px; }
  .grid-row .g-opts{ flex:0 0 260px; }
}

select.qi{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius-sm); font-family:inherit; font-size:13.8px; background:#fff; }

.blank-preview{ margin-top:10px; font-size:13.5px; color:var(--primary-deep); background:var(--accent-soft); border-radius:var(--radius-sm); padding:10px 13px; display:none; }
.blank-preview.show{ display:block; }
.blank-preview b{ font-weight:800; }

/* ---------- gate / consent / ready ---------- */
.hero-page{ text-align:center; padding:30px 4px 10px; }
.hero-page .icon-mark{ width:52px; height:52px; margin:0 auto 14px; border-radius:16px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; }
.hero-page .icon-mark svg{ width:24px; height:24px; stroke:var(--accent-deep); }
.hero-page h2{ color:var(--ink); font-size:19px; margin:0 0 6px; font-weight:800; }
.hero-page p{ color:var(--ink-soft); font-size:13.8px; line-height:1.75; }
.gate-input{ width:100%; max-width:340px; margin:20px auto 8px; display:block; text-align:center; font-size:16px; padding:14px; border:1.5px solid var(--line); border-radius:var(--radius-md); font-family:inherit; background:#fff; }
.gate-input:focus{ outline:2px solid var(--accent-deep); border-color:var(--accent-deep); }
.gate-example{ font-size:12px; color:var(--ink-faint); margin-bottom:6px; }
.gate-error{ display:none; color:var(--error); font-size:13px; font-weight:700; margin-top:12px; background:var(--error-soft); border-radius:var(--radius-sm); padding:10px 14px; }
.gate-error.show{ display:block; }

.consent-box{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; font-size:13.6px; color:var(--ink-soft); text-align:left; line-height:1.8; margin:18px 0; box-shadow:var(--shadow-soft); white-space:pre-wrap; }
.consent-box b{ color:var(--ink); }

.ready-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px 20px; text-align:left; margin:18px 0; box-shadow:var(--shadow-soft); }
.ready-card .row{ display:flex; justify-content:space-between; font-size:13.5px; padding:7px 0; border-bottom:1px solid var(--line-soft); }
.ready-card .row:last-child{ border-bottom:none; }
.ready-card .k{ color:var(--ink-faint); }
.ready-card .v{ font-weight:700; color:var(--primary-deep); }

.dossier-badge{ display:inline-block; background:var(--primary); color:#fff; font-size:12px; font-weight:800; padding:6px 14px; border-radius:20px; margin-bottom:14px; letter-spacing:.01em; }
.dossier-section{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:16px 18px; margin-bottom:12px; text-align:left; box-shadow:var(--shadow-soft); }
.dossier-section-title{ font-size:11.5px; font-weight:800; color:var(--primary-deep); text-transform:uppercase; letter-spacing:.05em; margin-bottom:11px; }
.kv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:2px 18px; }
.kv-grid.single{ grid-template-columns:1fr; }
.kv-grid .kv{ display:flex; flex-direction:column; gap:2px; padding:6px 0; border-bottom:1px solid var(--line-soft); }
.kv-grid .kv:last-child, .kv-grid .kv:nth-last-child(2):nth-child(odd){ border-bottom:none; }
.kv .k{ font-size:11px; color:var(--ink-faint); }
.kv .v{ font-size:13.5px; font-weight:700; color:var(--ink); }
@media (max-width:480px){ .kv-grid{ grid-template-columns:1fr; } .kv-grid .kv{ border-bottom:1px solid var(--line-soft) !important; } .kv-grid .kv:last-child{ border-bottom:none !important; } }

.scale-toggle{ width:100%; display:flex; justify-content:space-between; align-items:center; background:var(--card-soft); border:1px solid var(--line); border-radius:var(--radius-md); padding:13px 16px; cursor:pointer; font-size:13.8px; font-weight:700; color:var(--ink); margin-bottom:8px; }
.scale-toggle .score-badge{ background:var(--accent-soft); color:var(--accent-deep); border-radius:20px; padding:4px 11px; font-size:12px; font-weight:800; }
.scale-body{ display:none; margin:-4px 0 12px; }
.scale-body.open{ display:block; }

.coding-table{ width:100%; border-collapse:collapse; border:1px solid var(--line); border-radius:var(--radius-md); overflow:hidden; margin-bottom:0; background:var(--card); }
.coding-table th, .coding-table td{ padding:8px 12px; font-size:13px; text-align:left; border-bottom:1px solid var(--line-soft); }
.coding-table th{ background:var(--card-soft); color:var(--ink-soft); font-weight:700; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; }
.coding-table tr:last-child td{ border-bottom:none; }
.coding-table td.score-col{ text-align:right; font-weight:700; color:var(--primary-deep); width:90px; }
.dossier-error{ font-size:12px; color:var(--error); background:var(--error-soft); border-radius:var(--radius-sm); padding:10px 13px; margin-bottom:12px; }

.spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:7px; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---------- bottom nav ---------- */
#page-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:linear-gradient(0deg, var(--paper) 55%, rgba(246,241,231,0));
  padding:16px 20px calc(14px + env(safe-area-inset-bottom));
  display:flex; justify-content:center;
}
#page-nav .inner{ max-width:660px; width:100%; display:flex; justify-content:space-between; gap:10px; }
.nav-btn{ font-family:inherit; border-radius:30px; padding:13px 24px; font-size:14.5px; font-weight:800; cursor:pointer; border:none; letter-spacing:-.005em; }
.nav-btn.primary{ background:var(--primary); color:#fff; box-shadow:var(--shadow-lift); }
.nav-btn.primary:hover{ background:var(--primary-deep); }
.nav-btn.primary:disabled{ opacity:.55; cursor:progress; }
.nav-btn.ghost{ background:var(--card); color:var(--ink-soft); border:1px solid var(--line); }
.nav-btn.ghost:disabled{ visibility:hidden; }
.nav-btn.wide{ flex:1; }

/* ---------- terminal screens ---------- */
#thankyou, #declined{ display:none; max-width:520px; margin:100px auto; text-align:center; padding:0 20px; }
#thankyou h2, #declined h2{ color:var(--primary-deep); font-size:21px; font-weight:800; }
#thankyou p, #declined p{ color:var(--ink-soft); font-size:14px; }
.terminal-mark{ width:56px; height:56px; margin:0 auto 16px; border-radius:18px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; font-size:24px; }

.visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
</style>
</head>
<body>

<div id="progress-wrap">
  <div id="progress-inner">
    <div id="progress-top">
      <span id="progress-title">시작하기</span>
      <span id="progress-count"></span>
    </div>
    <div id="progress-track"><div id="progress-fill"></div></div>
  </div>
</div>

<header class="top">
  <div class="org">동국대학교 경찰행정학과 법심리연구소</div>
  <h1>관계성범죄 사건 담당자 설문</h1>
</header>

<main id="main">
  <div id="pages-container"></div>
</main>

<div id="page-nav">
  <div class="inner">
    <button id="btn-prev" class="nav-btn ghost" type="button">이전</button>
    <button id="btn-next" class="nav-btn primary wide" type="button">다음</button>
  </div>
</div>

<div id="thankyou">
  <div class="terminal-mark">✓</div>
  <h2>응답이 제출되었습니다</h2>
  <p>바쁘신 중에도 귀한 시간 내어 응답해 주셔서 진심으로 감사드립니다.<br>현장 경험이 통합 재발위험 평가척도와 모니터링 체계를 다듬는 데 큰 도움이 됩니다.</p>
</div>

<div id="declined">
  <div class="terminal-mark">·</div>
  <h2>설문 참여가 취소되었습니다</h2>
  <p>동의하지 않으신 것으로 확인되어 설문을 진행하지 않습니다.<br>협조해 주셔서 감사합니다.</p>
</div>

<iframe name="hidden_submit_target" class="visually-hidden" title="submit target"></iframe>
<form id="hidden-post-form" method="POST" target="hidden_submit_target" class="visually-hidden"></form>

<script>
/* =========================================================
   0. 설정
   ========================================================= */
const CONFIG = {
  SUBMIT_URL: "https://script.google.com/macros/s/AKfycbxAulEh9NfhdnI2Z9zGcsGJJFS7pyxiHnll7FBTsbWZIQFgtD9QJP-TiAH70pC5J-qZtQ/exec"
};

/* =========================================================
   1. 공통 옵션 풀
   ========================================================= */
const RANK_POOL = [
 "이별 거부","흉기 사용","살해 협박","목조름","자살 시도·협박","보호조치 위반 이력",
 "동일 피해자 대상 과거 폭력·신고 이력","타인 대상 폭력전과","평소 폭력적 성향",
 "피해자 통제·고립 정황","집착·과도한 질투","이별-재결합 반복","가해자의 경제적 문제",
 "가해자의 정당화·피해자 탓 태도","피해자의 정신건강 문제","피해자의 사회적지지 부족",
 "피해자의 경제적 취약성","알코올·약물 문제","기타(직접입력)"
];
const CM_POOL = [
 "이별 거부","흉기 사용","살해 협박","목조름","자살 시도·협박","보호조치 위반 이력",
 "피해자 통제·고립 정황","집착·과도한 질투","알코올·약물 문제","정신질환 이력",
 "추가할 요인 없음","기타(직접입력)"
];
const GRID_OPTS = ["있음","없음","확인 불가"];
const LIKERT5 = ["1","2","3","4","5"];
const CRIME_TYPES = ["가정폭력","스토킹","교제폭력"];

/* =========================================================
   2. 페이지 데이터
   kind: 'gate' | 'consent' | 'ready' | 'form'
   pageRole: 'apo' | 'investigator' (없으면 공통)
   pageCaseType: 'recur' (재발 사건에만 노출, 없으면 항상)
   문항의 role: 'apo' | 'investigator' (없으면 공통)
   ========================================================= */
const PAGES = [

{ id:"gate", kind:"gate", title:"코드 확인", color:"#8C8577" },

{ id:"consent", kind:"consent", title:"참여 동의", color:"#8C8577",
  consentText:
`본 설문은 동국대학교 경찰행정학과 법심리연구소에서 수행하는 「가정폭력·스토킹·교제폭력 통합 재발위험 평가척도 및 모니터링 관리체계 개발연구」의 일환으로 진행됩니다.

담당하셨던 사건 경험을 바탕으로 가해자 위험요인과 피해자 관련 요인(취약·욕구·반응성 등)을 파악하기 위한 목적으로 실시하며, 응답 내용은 연구 목적으로만 사용되고 사건이나 개인을 특정할 수 있는 정보는 결과에 포함되지 않습니다.

설문 참여는 자발적이며, 참여 도중 언제든지 중단하실 수 있습니다. 소요 시간은 약 20분입니다.

문의: 최예영 연구원 (choiyea02@naver.com)

위 내용에 동의하십니까?` },

// 새로운 prominent reminder page 삽입
{ id:"reminder", kind:"reminder", title:"응답 전 안내", color:"#8C8577",
  reminder:"지금부터 드리는 질문은 다음 페이지에 제시될 특정 사건 1건을 기준으로 응답해 주시기 바랍니다. \n 응답을 시작하시기 전, 눈을 감고 해당 사건을 다시 한번 떠올려 봐 주십시오. \n 충분히 상기하셨다면 아래 버튼을 눌러 설문에 참여해 주세요."
},

{ id:"ready", kind:"ready", title:"사건 개요", color:"#8C8577" },

{ id:"s0b", kind:"form", title:"기본 정보", eyebrow:"0", color:"#8C8577", questions:[
    {id:"B3", type:"radio",
      text:"가해자는 피해자와 어떤 관계였습니까?",
      prompt:"가해자는 피해자와 어떤 관계였습니까?",

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function isOtherOpt(opt){ return /\(직접입력\)|\(자유\s*기입\)|\(자유입력\)/.test(opt); }
function otherKey(qid, opt){ return qid + "__other__" + opt; }
function prefersReducedMotion(){
  return typeof window.matchMedia === "function" && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

function parseCode(raw){
  const s = String(raw||"").replace(/\s+/g, "");
  if(!s) return null;
  for(const crime of CRIME_TYPES){
    const idx = s.indexOf(crime);
    if(idx > 0){
      const name = s.slice(0, idx);
      const num = s.slice(idx + crime.length);
      if(name && num) return { name, crime, num };
    }
  }
  return null;
}

function jsonpRequest(url, params, timeoutMs){
  return new Promise((resolve, reject) => {
    const cbName = "jsonp_cb_" + Math.random().toString(36).slice(2);
    const script = document.createElement("script");
    let done = false;
    const timer = setTimeout(() => { if(done) return; done = true; cleanup(); reject(new Error("timeout")); }, timeoutMs || 9000);
    function cleanup(){ delete window[cbName]; script.remove(); clearTimeout(timer); }
    window[cbName] = (data) => { if(done) return; done = true; cleanup(); resolve(data); };
    const qs = Object.keys(params).map(k => encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    script.src = url + (url.indexOf("?")>-1?"&":"?") + qs + "&callback=" + cbName;
    script.onerror = () => { if(done) return; done = true; cleanup(); reject(new Error("network")); };
    document.body.appendChild(script);
  });
}

/* =========================================================
   5. 문항 렌더링

function buildOptList(q, kind){
  const wrap = document.createElement("div");
  wrap.className = "opt-list";
  q.opts.forEach(opt=>{
    const row = document.createElement("label");
    row.className = "opt";
    const input = document.createElement("input");
    input.type = kind === "checkbox" ? "checkbox" : "radio";
    input.name = q.id;
    input.value = opt;
    input.addEventListener("change", ()=> onOptionChange(q, kind));
    const span = document.createElement("span");
    span.textContent = opt;
    row.appendChild(input); row.appendChild(span);
    wrap.appendChild(row);

    if(!q.noAutoOther && isOtherOpt(opt)){
      const oi = document.createElement("input");
      oi.type = "text"; oi.className = "other-text"; oi.placeholder = "직접 입력해 주세요";
      oi.dataset.forOpt = opt;
      oi.addEventListener("input", ()=>{ answers[otherKey(q.id, opt)] = oi.value; });
      wrap.appendChild(oi);
    }
  });
  return wrap;
}

function onOptionChange(q, kind){
  const qEl = document.getElementById("card-"+q.id);
  const inputs = qEl.querySelectorAll('input[name="'+CSS.escape(q.id)+'"]');
  let val;
  if(kind === "checkbox"){ val = Array.from(inputs).filter(i=>i.checked).map(i=>i.value); }
  else { const chk = Array.from(inputs).find(i=>i.checked); val = chk ? chk.value : ""; }
  answers[q.id] = val;
  Array.from(qEl.querySelectorAll(".opt")).forEach(optEl=>{
    const inp = optEl.querySelector("input");
    optEl.classList.toggle("checked", inp.checked);
  });
  Array.from(qEl.querySelectorAll(".other-text")).forEach(oi=>{
    const opt = oi.dataset.forOpt;
    const isChecked = Array.from(inputs).some(i=>i.value===opt && i.checked);
    oi.classList.toggle("show", isChecked);
  });
  if(q.blankPreview){
    const prev = qEl.querySelector(".blank-preview");
    if(prev){
      if(kind !== "checkbox" && val){
        const parts = q.blankPreview.split("{value}");
        prev.innerHTML = escapeHtml(parts[0]) + "<b>" + escapeHtml(val) + "</b>" + escapeHtml(parts[1]||"");
        prev.classList.add("show");
      } else { prev.classList.remove("show"); }
    }
  }
  clearInvalid(q.id);
  evaluateConditionsInPage();
}

function buildLikert(q){
  const wrap = document.createElement("div");
  const row = document.createElement("div"); row.className = "likert-row";
  LIKERT5.forEach(v=>{
    const btn = document.createElement("div");
    btn.className = "likert-btn"; btn.textContent = v; btn.dataset.val = v;
    btn.addEventListener("click", ()=>{
      answers[q.id] = v;
      Array.from(row.children).forEach(c=>c.classList.toggle("checked", c===btn));
      clearInvalid(q.id); evaluateConditionsInPage();
    });
    row.appendChild(btn);
  });
  wrap.appendChild(row);
  const lab = document.createElement("div"); lab.className = "likert-labels";
  lab.innerHTML = `<span>${escapeHtml(q.labels[0])}</span><span>${escapeHtml(q.labels[1])}</span>`;
  wrap.appendChild(lab);
  return wrap;
}

function buildGrid(q){
  const wrap = document.createElement("div"); wrap.className = "grid-wrap";
  const state = {};
  if(q.rowsLikert){
    q.rowsLikert.forEach(rowDef=>{
      const rowEl = document.createElement("div"); rowEl.className = "grid-row";
      const lab = document.createElement("div"); lab.className = "g-label"; lab.textContent = rowDef.label;
      const opts = document.createElement("div"); opts.className = "g-opts";
      LIKERT5.forEach(v=>{
        const o = document.createElement("div"); o.className = "grid-opt"; o.textContent = v;
        o.addEventListener("click", ()=>{
          state[rowDef.label] = v;
          Array.from(opts.children).forEach(c=>c.classList.toggle("checked", c===o));
          answers[q.id] = Object.assign({}, state);
          clearInvalid(q.id);
        });
        opts.appendChild(o);
      });
      rowEl.appendChild(lab); rowEl.appendChild(opts);
      wrap.appendChild(rowEl);
    });
    return wrap;
  }
  q.rows.forEach(rowLabel=>{
    const rowEl = document.createElement("div"); rowEl.className = "grid-row";
    const lab = document.createElement("div"); lab.className = "g-label"; lab.textContent = rowLabel;
    const opts = document.createElement("div"); opts.className = "g-opts";
    q.opts.forEach(opt=>{
      const o = document.createElement("div"); o.className = "grid-opt"; o.textContent = opt;
      o.addEventListener("click", ()=>{
        state[rowLabel] = opt;
        Array.from(opts.children).forEach(c=>c.classList.toggle("checked", c===o));
        answers[q.id] = Object.assign({}, state);
        clearInvalid(q.id);
      });
      opts.appendChild(o);
    });
    rowEl.appendChild(lab); rowEl.appendChild(opts);
    wrap.appendChild(rowEl);
  });
  return wrap;
}

function buildRank(q){
  const wrap = document.createElement("div");
  const sel = document.createElement("select"); sel.className = "qi";
  const blank = document.createElement("option"); blank.value=""; blank.textContent="선택해 주세요"; sel.appendChild(blank);
  q.opts.forEach(opt=>{ const o = document.createElement("option"); o.value = opt; o.textContent = opt; sel.appendChild(o); });
  sel.addEventListener("change", ()=>{ answers[q.id] = sel.value; clearInvalid(q.id); refreshRankGroup(q.group); });
  sel.dataset.group = q.group; sel.dataset.qid = q.id;
  wrap.appendChild(sel);
  return wrap;
}

function refreshRankGroup(group){
  const selects = Array.from(document.querySelectorAll('select[data-group="'+CSS.escape(group)+'"]'));
  const chosen = selects.map(s=>s.value).filter(Boolean);
  selects.forEach(s=>{
    Array.from(s.options).forEach(o=>{
      if(!o.value) return;
      o.disabled = chosen.includes(o.value) && s.value !== o.value;
    });
  });
}

function refreshInterpolatedTexts(){
  PAGES.forEach(page=>{
    if(!page.questions) return;
    page.questions.forEach(q=>{
      if(!q.text || q.text.indexOf("{") === -1) return;
      const card = document.getElementById("card-"+q.id);
      if(!card) return;
      const t = card.querySelector(".q-text");
      if(!t) return;
      t.innerHTML = escapeHtml(interpolateText(q.text)) + (q.req ? '<span class="req">*</span>' : "");
    });
  });
}

function interpolateText(text){
  if(!text || text.indexOf("{") === -1) return text;
  const cd = PREFILL.caseDetail || {};
  return text
    .replace(/\{reportDate\}/g, cd.reportDate || "최초 신고")
    .replace(/\{firstRecurDate\}/g, cd.firstRecurDate || "재신고");
}

function buildQuestionCard(q){
  const card = document.createElement("div");
  card.className = "q";
  card.id = "card-" + q.id;
  if(q.cond) card.dataset.cond = "1";
  if(q.role) card.dataset.role = q.role;

  const t = document.createElement("div"); t.className = "q-text";
  t.innerHTML = escapeHtml(interpolateText(q.text)) + (q.req ? '<span class="req">*</span>' : "");
  card.appendChild(t);
  if(q.note){ const n = document.createElement("div"); n.className="q-note"; n.textContent=q.note; card.appendChild(n); }

  let body;
  if(q.type === "radio" || q.type === "checkbox") body = buildOptList(q, q.type);
  else if(q.type === "likert") body = buildLikert(q);
  else if(q.type === "grid") body = buildGrid(q);
  else if(q.type === "rank") body = buildRank(q);
  else if(q.type === "text"){
    body = document.createElement("input"); body.type="text"; body.className="qi";
    body.addEventListener("input", ()=>{ answers[q.id]=body.value; clearInvalid(q.id); });
  }
  else if(q.type === "textarea"){
    body = document.createElement("textarea"); body.className="qi";
    body.addEventListener("input", ()=>{ answers[q.id]=body.value; clearInvalid(q.id); });
  }
  card.appendChild(body);

  if(q.blankPreview){ const prev = document.createElement("div"); prev.className = "blank-preview"; card.appendChild(prev); }

  const err = document.createElement("div"); err.className="q-error"; err.textContent="이 문항에 응답해 주세요.";
  card.appendChild(err);
  return card;
}

function clearInvalid(qid){ const el = document.getElementById("card-"+qid); if(el) el.classList.remove("invalid"); }

function condMet(cond){
  const v = answers[cond.on];
  if(v === undefined || v === null || v === "") return false;
  if(cond.op === "="){ if(Array.isArray(v)) return v.includes(cond.val); return v === cond.val; }
  if(cond.op === "starts"){ return typeof v === "string" && v.indexOf(cond.val) === 0; }
  if(cond.op === "<="){ return Number(v) <= cond.val; }
  if(cond.op === ">="){ return Number(v) >= cond.val; }
  return false;
}

function roleAllows(q){ return !q.role || q.role === PREFILL.role; }

function evaluateConditionsInPage(){
  document.querySelectorAll('.page.active .q[data-cond="1"]').forEach(el=>{
    const qid = el.id.replace("card-","");
    const q = findQuestion(qid);
    const shouldShow = condMet(q.cond) && roleAllows(q);
    const isHidden = el.classList.contains("hidden");
    if(shouldShow && isHidden){ el.classList.remove("hidden"); }
    else if(!shouldShow && !isHidden){ el.classList.add("hidden"); delete answers[qid]; }
  });
}

function findQuestion(qid){
  for(const p of PAGES){ if(!p.questions) continue; for(const q of p.questions){ if(q.id===qid) return q; } }
  return null;
}

  const parts = [];
  ["가정폭력","교제폭력","스토킹"].forEach(k=>{
    if(obj[k] !== undefined && obj[k] !== null && obj[k] !== "") parts.push(k+" "+obj[k]+"건");
  });
  const totalPart = (obj.total !== undefined && obj.total !== null && obj.total !== "") ? ("총 "+obj.total+"건" + (parts.length? " · ":"")) : "";
  return totalPart + parts.join(" · ");
}

function buildDossierHtml(cd){
  if(!cd) return "";
  if(cd.__parse_error__){
    return `<div class="dossier-error">사건상세 정보 형식을 읽을 수 없습니다. 사건정보 시트의 JSON 형식을 확인해 주세요.</div>`;
  }
  let html = "";

  const badgeParts = [cd.agency, cd.crimeType, cd.label].filter(Boolean);
  if(badgeParts.length) html += `<div class="dossier-badge">${escapeHtml(badgeParts.join(" · "))}</div>`;

  const apoStr = cd.apo ? [cd.apo.name, cd.apo.rank].filter(Boolean).join(" ") : "";
  const detStr = cd.detective ? [cd.detective.name, cd.detective.rank].filter(Boolean).join(" ") : "";
  const investRows = kvRow("APO", apoStr) + kvRow("수사관", detStr);
  if(investRows) html += `<div class="dossier-section"><div class="dossier-section-title">조사자 정보</div><div class="kv-grid">${investRows}</div></div>`;

  const basicRows = kvRow("신고접수일", cd.reportDate)
    + kvRow("피해자", fmtPerson(cd.victim)) + kvRow("가해자", fmtPerson(cd.offender))
    + kvRow("죄종", cd.crimeType) + kvRow("가·피해자 관계", cd.relationship)
    + kvRow("흉기 사용", cd.weaponUsed) + kvRow("쌍방 여부", cd.mutual)
    + kvRow("부여 등급", cd.gradeAssigned) + kvRow("현재 등급", cd.gradeCurrent);
  if(basicRows) html += `<div class="dossier-section"><div class="dossier-section-title">기본정보</div><div class="kv-grid">${basicRows}</div></div>`;

  const histRows = kvRow("과거 3년 사건접수", fmtBreakdown(cd.history3yr)) + kvRow("과거 1년 신고", fmtBreakdown(cd.history1yr));
  if(histRows) html += `<div class="dossier-section"><div class="dossier-section-title">과거 전력</div><div class="kv-grid single">${histRows}</div></div>`;

  const recurRows = kvRow("재신고 횟수", fmtBreakdown(cd.recurCount)) + kvRow("최초 재신고일", cd.firstRecurDate);
  if(recurRows) html += `<div class="dossier-section"><div class="dossier-section-title">재신고</div><div class="kv-grid single">${recurRows}</div></div>`;

  if(Array.isArray(cd.scales)){
    cd.scales.forEach((scale, idx)=>{
      if(!scale.items || !scale.items.length) return;

      const hasTotalScore = scale.totalScore !== undefined
        && scale.totalScore !== null
        && String(scale.totalScore).trim() !== "";

      const scoreBadge = hasTotalScore
        ? `<span class="score-badge">총점 ${escapeHtml(scale.totalScore)}${scale.maxScore ? (' / '+escapeHtml(scale.maxScore)) : ''}</span>`
        : `<span class="score-badge">미작성</span>`;

      const toggleId = "scale-body-"+idx;
      html += `<div class="scale-toggle" data-target="${toggleId}"><span>${escapeHtml(scale.name||"척도")}</span>${scoreBadge}</div>`;
      html += `<div class="scale-body" id="${toggleId}"><table class="coding-table"><thead><tr><th>문항</th><th>점수</th></tr></thead><tbody>`;
      scale.items.forEach(it=>{
        const scoreDisplay = it.scoreLabel ? `${escapeHtml(it.scoreLabel)} (${escapeHtml(it.score)}점)` : escapeHtml(it.score !== undefined ? it.score : "");
        html += `<tr><td>${escapeHtml(it.label||"")}</td><td class="score-col">${scoreDisplay}</td></tr>`;
      });
      html += `</tbody></table></div>`;
    });
  }

  return html;
}

function buildReadyPage(page){
  const el = document.createElement("div");
  el.className = "hero-page";
  el.innerHTML = `<div class="icon-mark">${svgIcon('doc')}</div><h2>사건 개요</h2>`;
  const wrap = document.createElement("div");
  const dossierHtml = buildDossierHtml(PREFILL.caseDetail);
  wrap.innerHTML = dossierHtml || `
    <div class="ready-card">
      <div class="row"><span class="k">담당자</span><span class="v">${escapeHtml(PREFILL.officer||"-")}</span></div>
      <div class="row"><span class="k">죄종</span><span class="v">${escapeHtml(PREFILL.crime||"-")}</span></div>
    </div>`;
  el.appendChild(wrap);
  // 척도 상세 문항 안내문구 UI 추가
  // "scale-toggle"이 있으면 그 위에 안내문구가 이미 있는지 검사 후 없으면 추가, 있으면 교체
  setTimeout(() => {
    const scaleToggles = wrap.querySelectorAll(".scale-toggle");
    if (scaleToggles.length >= 2) {
      // 두 척도에 대한 상세 문항 안내문구가 필요함
      // 안내문구(유사 문구 포함) 있는지 확인
      // 안내문구 삽입 위치: 첫 번째 scale-toggle 바로 앞
      // 문구: '상세 문항을 보려면 클릭'
      const firstToggle = scaleToggles[0];
      // 이전 형제 노드에 안내문구가 있는지 확인
      let prev = firstToggle.previousElementSibling;
      let foundGuide = false;
      // 안내문구 후보: 텍스트에 '문항' 또는 '상세'가 들어간 안내 스타일 div
      while (prev && prev.nodeType === 1 && prev.className !== "scale-toggle") {
        if (
          prev.textContent &&
          /문항.*(확인|보기|열람|눌러|상세|자세히|항목)/.test(prev.textContent)
        ) {
          prev.textContent = "상세 문항을 보려면 클릭";
          foundGuide = true;
          break;
        }
        prev = prev.previousElementSibling;
      }
      if (!foundGuide) {
        const guide = document.createElement("div");
        guide.style.fontSize = "12.8px";
        guide.style.color = "var(--ink-faint)";
        guide.style.margin = "0 0 6px 2px";
        guide.textContent = "상세 문항을 보려면 클릭";
        firstToggle.parentNode.insertBefore(guide, firstToggle);
      }
    }
    // 단일 scale-toggle이더라도 안내문구가 이미 있으면 교체, 없으면 추가
    if (scaleToggles.length === 1) {
      const firstToggle = scaleToggles[0];
      let prev = firstToggle.previousElementSibling;
      let foundGuide = false;
      while (prev && prev.nodeType === 1 && prev.className !== "scale-toggle") {
        if (
          prev.textContent &&
          /문항.*(확인|보기|열람|눌러|상세|자세히|항목)/.test(prev.textContent)
        ) {
          prev.textContent = "상세 문항을 보려면 클릭";
          foundGuide = true;
          break;
        }
        prev = prev.previousElementSibling;
      }
      if (!foundGuide) {
        const guide = document.createElement("div");
        guide.style.fontSize = "12.8px";
        guide.style.color = "var(--ink-faint)";
        guide.style.margin = "0 0 6px 2px";
        guide.textContent = "상세 문항을 보려면 클릭";
        firstToggle.parentNode.insertBefore(guide, firstToggle);
      }
    }
  }, 0);
  wrap.querySelectorAll(".scale-toggle").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const body = document.getElementById(btn.dataset.target);
      if(body) body.classList.toggle("open");
    });
  });
  return el;
}

function buildReminderPage(page){
  const el = document.createElement("div");
  el.className = "hero-page";
  el.innerHTML = `<div class="icon-mark">${svgIcon('doc')}</div><h2>응답 전 안내</h2>`;
  // prominent instruction
  const prominent = document.createElement("div");
  prominent.style.background = "var(--accent-soft)";
  prominent.style.border = "2px solid var(--accent-deep)";
  prominent.style.borderRadius = "var(--radius-lg)";
  prominent.style.padding = "28px 20px";
  prominent.style.fontSize = "16.5px";
  prominent.style.color = "var(--accent-deep)";
  prominent.style.fontWeight = "700";
  prominent.style.margin = "32px auto 32px";
  prominent.style.maxWidth = "480px";
  prominent.style.textAlign = "center";
  prominent.style.whiteSpace = "pre-wrap";
  prominent.textContent = page.reminder;
  el.appendChild(prominent);
  // Proceed button (reuse navigation)
  return el;
}

function buildFormPage(page){
  const el = document.createElement("div");
  const head = document.createElement("div"); head.className = "page-head";
  head.style.setProperty("--sec-color", page.color);
  head.innerHTML = `${page.eyebrow ? `<div class="page-eyebrow">Section ${escapeHtml(page.eyebrow)}</div>` : ""}<h2>${escapeHtml(page.title)}</h2>`;
  el.appendChild(head);
  if(page.showRecurDate && PREFILL.caseDetail && PREFILL.caseDetail.firstRecurDate){
    const badge = document.createElement("div");
    badge.className = "dossier-badge";
    badge.textContent = "최초 재신고일: " + PREFILL.caseDetail.firstRecurDate;
    el.appendChild(badge);
  }
  if(page.intro){ const intro = document.createElement("div"); intro.className="page-intro"; intro.textContent = page.intro; el.appendChild(intro); }
  page.questions.forEach(q=> el.appendChild(buildQuestionCard(q)));
  return el;
}

function renderAllPages(){
  PAGES.forEach((page, idx)=>{
    const wrap = document.createElement("div");
    wrap.className = "page";
    wrap.id = "raw-page-" + idx;
    let inner;
    if(page.kind === "gate") inner = buildGatePage(page);
    else if(page.kind === "consent") inner = buildConsentPage(page);
    else if(page.kind === "reminder") inner = buildReminderPage(page);
    else if(page.kind === "ready") inner = buildReadyPage(page);
    else inner = buildFormPage(page);
    wrap.appendChild(inner);
    pagesContainer.appendChild(wrap);
  });
}

function refreshReadyPageContent(){
  const idx = PAGES.findIndex(p=>p.kind==="ready");
  if(idx<0) return;
  const wrap = document.getElementById("raw-page-"+idx);
  wrap.innerHTML = "";
  wrap.appendChild(buildReadyPage(PAGES[idx]));
}

/* =========================================================
   7. 활성 페이지 계산 (역할/사건유형 반영)
   ========================================================= */
function pageApplies(page){
  if(page.pageRole && page.pageRole !== PREFILL.role) return false;
  if(page.pageCaseType === "recur" && PREFILL.caseType !== "recur") return false;
  return true;
}

function computeActivePages(){
  // gate, consent, reminder, ready
  const prefix = PAGES.slice(0,4);
  const rest = PAGES.slice(4).filter(pageApplies);
  ACTIVE_PAGES = prefix.concat(rest);
}

function realIndexOf(page){ return PAGES.indexOf(page); }

/* =========================================================
   8. 네비게이션 (부드러운 전환 포함)
   ========================================================= */
const btnPrev = document.getElementById("btn-prev");
const btnNext = document.getElementById("btn-next");
const progressFill = document.getElementById("progress-fill");
const progressTitle = document.getElementById("progress-title");
const progressCount = document.getElementById("progress-count");
const container = document.getElementById("pages-container");

function currentPage(){ return ACTIVE_PAGES[pageIndex]; }
function currentPageEl(){ return document.getElementById("raw-page-" + realIndexOf(currentPage())); }

function goTo(newIdx, animate){
  if(isAnimating) return;
  const dir = newIdx > pageIndex ? 1 : -1;
  const oldPage = ACTIVE_PAGES[pageIndex];
  const newPage = ACTIVE_PAGES[newIdx];
  const oldEl = document.getElementById("raw-page-"+realIndexOf(oldPage));
  const newEl = document.getElementById("raw-page-"+realIndexOf(newPage));

  const finish = () => {
    pageIndex = newIdx;
    evaluateConditionsInPage();
    updateNavUI();
    if(window.scrollTo) window.scrollTo({top:0, behavior: prefersReducedMotion() ? "auto" : "smooth"});
  };

  if(!animate || prefersReducedMotion() || !oldEl){
    if(oldEl) oldEl.classList.remove("active");
    newEl.classList.add("active");
    finish();
    return;
  }

  isAnimating = true;
  const oldHeight = oldEl.offsetHeight;
  container.style.height = oldHeight + "px";
  container.classList.add("transitioning");

  newEl.classList.add("active", "incoming");
  newEl.style.transform = "translateX(" + (dir>0? "16px" : "-16px") + ")";
  newEl.style.opacity = "0";
  void newEl.offsetWidth; // reflow

  const dur = "360ms";
  const ease = "cubic-bezier(.4,0,.2,1)";
  oldEl.style.transition = "transform "+dur+" "+ease+", opacity "+dur+" ease";
  newEl.style.transition = "transform "+dur+" "+ease+", opacity "+dur+" ease";
  oldEl.style.transform = "translateX(" + (dir>0? "-16px" : "16px") + ")";
  oldEl.style.opacity = "0";
  newEl.style.transform = "translateX(0)";
  newEl.style.opacity = "1";

  setTimeout(()=>{
    oldEl.classList.remove("active");
    oldEl.style.cssText = "";
    newEl.classList.remove("incoming");
    newEl.style.cssText = "";
    container.classList.remove("transitioning");
    container.style.height = "auto";
    isAnimating = false;
    finish();
  }, 380);
}

function updateNavUI(){
  const total = ACTIVE_PAGES.length;
  const page = currentPage();
  progressFill.style.width = Math.round(((pageIndex+1)/total)*100) + "%";
  progressCount.textContent = (pageIndex+1) + " / " + total;
  progressTitle.textContent = page.kind === "form" ? page.title : (page.kind === "gate" ? "시작하기" : page.kind === "consent" ? "참여 동의" : "사건 확인");
  btnPrev.disabled = (pageIndex === 0);
  const isLast = (pageIndex === total-1);
  if(page.kind === "gate"){ btnNext.textContent = "다음"; btnPrev.disabled = true; }
  else if(page.kind === "ready"){ btnNext.textContent = "사건에 대해 충분히 상기했습니다."; }
  else if(isLast){ btnNext.textContent = "제출하기"; }
  else { btnNext.textContent = "다음"; }
}

function currentPageRequiredQuestions(){
  const page = currentPage();
  if(!page.questions) return [];
  return page.questions.filter(q => q.req && roleAllows(q) && isVisibleInDom(q.id));
}
function isVisibleInDom(qid){
  const el = document.getElementById("card-"+qid);
  return el && !el.classList.contains("hidden");
}

function validateCurrentFormPage(){
  const required = currentPageRequiredQuestions();
  let firstInvalid = null;
  required.forEach(q=>{
    const v = answers[q.id];
    let ok;
    if(q.type === "grid"){
      const need = q.rows ? q.rows.length : (q.rowsLikert ? q.rowsLikert.length : 0);
      ok = v && typeof v === "object" && Object.keys(v).length === need;
    } else if(Array.isArray(v)) ok = v.length > 0;
    else ok = v !== undefined && v !== null && String(v).trim() !== "";
    const card = document.getElementById("card-"+q.id);
    if(!ok){ card.classList.add("invalid"); if(!firstInvalid) firstInvalid = card; }
    else card.classList.remove("invalid");
  });
  if(firstInvalid){ if(firstInvalid.scrollIntoView) firstInvalid.scrollIntoView({behavior:"smooth", block:"center"}); return false; }
  return true;
}

async function onNextClick(){
  if(isAnimating) return;
  const page = currentPage();

  if(page.kind === "gate"){ await handleGateNext(); return; }

  if(page.kind === "consent"){
    const chosen = answers["__consent__"];
    if(!chosen){ document.getElementById("card-__consent__").classList.add("invalid"); return; }
    if(chosen === "아니오"){
      document.getElementById("main").style.display = "none";
      document.getElementById("progress-wrap").style.display = "none";
      document.getElementById("page-nav").style.display = "none";
      document.getElementById("declined").style.display = "block";
      return;
    }
    // After consent, go to reminder page
    goTo(pageIndex+1, true);
    return;
  }

  if(page.kind === "reminder"){ goTo(pageIndex+1, true); return; }

  if(!validateCurrentFormPage()) return;
  const isLast = (pageIndex === ACTIVE_PAGES.length-1);
  if(isLast){ submitToBackend(); return; }
  goTo(pageIndex+1, true);
}

function onPrevClick(){
  if(isAnimating || pageIndex === 0) return;
  goTo(pageIndex-1, true);
}

btnNext.addEventListener("click", onNextClick);
btnPrev.addEventListener("click", onPrevClick);

/* ---- gate 처리 ---- */
async function handleGateNext(){
  const input = document.getElementById("gate-code-input");
  const errEl = document.getElementById("gate-error");
  errEl.classList.remove("show");

  const raw = input.value.trim();
  const parsed = parseCode(raw);
  if(!parsed){
    errEl.textContent = "코드 형식을 확인해 주세요. 예) 홍길동가정폭력125";
    errEl.classList.add("show");
    return;
  }

  btnNext.disabled = true;
  btnNext.innerHTML = '<span class="spinner"></span>확인 중...';

  try{
    const res = await jsonpRequest(CONFIG.SUBMIT_URL, {code: raw});
    btnNext.disabled = false;
    if(res && res.found){
      PREFILL.officer = parsed.name;
      PREFILL.crime = parsed.crime;
      PREFILL.case = parsed.num;
      PREFILL.caseDetail = res.caseDetail || null;
      PREFILL.role = (res.role === "수사관") ? "investigator" : "apo";
      PREFILL.caseType = (res.caseType === "재발") ? "recur" : "single";
      RAW_CODE = raw;
      computeActivePages();
      refreshReadyPageContent();
      refreshInterpolatedTexts();
      goTo(pageIndex+1, true);
    } else {
      errEl.textContent = "등록된 코드를 찾을 수 없습니다. 코드를 다시 확인해 주세요.";
      errEl.classList.add("show");
      updateNavUI();
    }
  } catch(err){
    btnNext.disabled = false;
    errEl.textContent = "확인 중 오류가 발생했습니다. 인터넷 연결을 확인하시고 다시 시도해 주세요.";
    errEl.classList.add("show");
    updateNavUI();
  }
}

/* =========================================================
   9. 제출
   ========================================================= */
function submitToBackend(){
  btnNext.disabled = true;
  btnNext.innerHTML = '<span class="spinner"></span>제출 중...';
  btnPrev.style.visibility = "hidden";

  const form = document.getElementById("hidden-post-form");
  form.innerHTML = "";
  form.action = CONFIG.SUBMIT_URL;

  const payload = Object.assign({}, answers, {
    _code: RAW_CODE, _officer: PREFILL.officer, _crime: PREFILL.crime, _case: PREFILL.case,
    _role: PREFILL.role, _caseType: PREFILL.caseType, _submitted_at: new Date().toISOString()
  });

  Object.keys(payload).forEach(k=>{
    const v = payload[k];
    const input = document.createElement("input");
    input.type = "hidden"; input.name = k;
    input.value = (typeof v === "object") ? JSON.stringify(v) : String(v);
    form.appendChild(input);
  });

  const iframe = document.querySelector('iframe[name="hidden_submit_target"]');
  iframe.addEventListener("load", showThankYou, {once:true});
  form.submit();
  setTimeout(showThankYou, 3000);
}

let thankShown = false;
function showThankYou(){
  if(thankShown) return; thankShown = true;
  document.getElementById("main").style.display = "none";
  document.getElementById("progress-wrap").style.display = "none";
  document.getElementById("page-nav").style.display = "none";
  document.getElementById("thankyou").style.display = "block";
  if(window.scrollTo) window.scrollTo({top:0, behavior:"smooth"});
}

/* =========================================================
   10. 초기화
   ========================================================= */
renderAllPages();
document.getElementById("raw-page-0").classList.add("active");
updateNavUI();

/* 자동화 테스트 전용 전역 노출 (사이트 동작에는 영향 없음) */
window.PAGES = PAGES;
window.PREFILL = PREFILL;
window.answers = answers;
window.parseCode = parseCode;
window.goTo = goTo;
window.computeActivePages = computeActivePages;
window.refreshReadyPageContent = refreshReadyPageContent;
window.ACTIVE_PAGES = ACTIVE_PAGES;
window.getPageIndex = () => pageIndex;
window.getActivePages = () => ACTIVE_PAGES;
</script>
